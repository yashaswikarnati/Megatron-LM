# 6B+14B Hetero enc TP1/DP64, LLM TP4/PP2/DP8+SP, 75% vision
# Max hetero advantage: zero enc TP comm + three-phase schedule + high enc ratio
# 8 images × 768 seq = 6144 tokens
experiment:
  name: 6b14b_hetero_tp1_pp2_75pct
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 48
    hidden_size: 3072
    num_attention_heads: 24
    seq_length: 768
  llm:
    num_layers: 48
    hidden_size: 5120
    num_attention_heads: 40
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 1
    dp: 64
  llm:
    tp: 4
    dp: 8
    pp: 2

data:
  micro_batch_size: 1
  num_microbatches: 16
  num_images_per_sample: 8

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48

sequence_parallel: true
pp_mode: colocated
encoder_param_offload: false
