# 1B+70B Hetero enc TP2/DP32, 50% vision, 8 images × 512 seq
experiment:
  name: 1b70b_hetero_tp2_50pct
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 40
    hidden_size: 1408
    num_attention_heads: 16
    seq_length: 512
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 2
    dp: 32
  llm:
    tp: 8
    dp: 4
    pp: 2

data:
  micro_batch_size: 1
  num_microbatches: 32
  num_images_per_sample: 8

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 40

sequence_parallel: true
pp_mode: colocated
encoder_param_offload: false
