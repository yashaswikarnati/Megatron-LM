# 1B+70B Homo PP4/DP2, 50% vision, 8 nodes
# TP8/PP4/DP2+SP, no LLM recompute, encoder full recompute
experiment:
  name: 1b70b_homo_pp4_50pct
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 40
    hidden_size: 1408
    num_attention_heads: 16
    seq_length: 1024
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 8
    dp: 2
  llm:
    tp: 8
    dp: 2
    pp: 4

data:
  micro_batch_size: 1
  num_microbatches: 64
  num_images_per_sample: 4

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 40

sequence_parallel: true
pp_mode: homo
encoder_param_offload: false
