# 1B ViT + 70B LLM, Homo, 50% vision, 8 nodes
# TP8/PP8/DP1+SP, uneven 3+11×7, block3 recompute, GBS=128
experiment:
  name: 1b70b_homo_50pct
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 40
    hidden_size: 1408
    num_attention_heads: 16
    seq_length: 1024
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 8
    dp: 1
  llm:
    tp: 8
    dp: 1
    pp: 8

data:
  micro_batch_size: 1
  num_microbatches: 128
  num_images_per_sample: 4

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 40
  llm:
    recompute_granularity: full
    recompute_method: block
    recompute_num_layers: 3

sequence_parallel: true
pp_mode: homo
first_pipeline_num_layers: 3
encoder_param_offload: false
