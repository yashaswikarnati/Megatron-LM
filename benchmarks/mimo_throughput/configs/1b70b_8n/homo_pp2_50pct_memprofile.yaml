# 1B+70B Homo PP2/DP4, 50% vision — with memory profiling
# This will OOM but the snapshot captures the state at OOM
experiment:
  name: 1b70b_homo_pp2_50pct_memprofile
  num_iterations: 5
  warmup_iterations: 0
  log_interval: 1

model:
  encoder:
    num_layers: 40
    hidden_size: 1408
    num_attention_heads: 16
    seq_length: 1024
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 8
    dp: 4
  llm:
    tp: 8
    dp: 4
    pp: 2

data:
  micro_batch_size: 1
  num_microbatches: 32
  num_images_per_sample: 4

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 40

sequence_parallel: true
pp_mode: homo
encoder_param_offload: false
