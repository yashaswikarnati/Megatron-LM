# 3B ViT + 70B LLM, 8 nodes (64 GPUs)
# LLM: TP8/PP4/DP2+SP, encoder: varies per experiment
# 50% vision budget = 4096 tokens total
experiment:
  name: 3b70b_sweep_baseline
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 48
    hidden_size: 2304
    num_attention_heads: 32
    seq_length: 1024
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 8
    dp: 8
  llm:
    tp: 8
    dp: 2
    pp: 4

data:
  micro_batch_size: 1
  num_microbatches: 8
  num_images_per_sample: 4

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48

sequence_parallel: true
pp_mode: colocated
encoder_param_offload: false
