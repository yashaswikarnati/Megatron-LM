# 3B ViT + 70B LLM, colocated, WITH offload, 4 nodes (32 GPUs)
# Encoder: TP8/DP4, LLM: TP8/DP1/PP4
# mbs=1, nmb=8, num_images=4
experiment:
  name: 3b70b_colocated_with_offload
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 48
    hidden_size: 2304
    num_attention_heads: 32
    seq_length: 1024
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 8
    dp: 4
  llm:
    tp: 8
    dp: 1
    pp: 4

data:
  micro_batch_size: 1
  num_microbatches: 8
  num_images_per_sample: 4

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48

encoder_param_offload: true
