# Baseline: 1B ViT + 7B LLM, colocated hetero TP, PP2, no offload
# 8 GPUs (1 node): encoder TP2/DP4, LLM TP4/DP1/PP2
experiment:
  name: offload_test_baseline
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 40
    hidden_size: 1408
    num_attention_heads: 16
    seq_length: 1024
  llm:
    num_layers: 32
    hidden_size: 4096
    num_attention_heads: 32
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 2
    dp: 4
  llm:
    tp: 4
    dp: 1
    pp: 2

data:
  micro_batch_size: 2
  num_microbatches: 4
  num_images_per_sample: 2

encoder_param_offload: false
