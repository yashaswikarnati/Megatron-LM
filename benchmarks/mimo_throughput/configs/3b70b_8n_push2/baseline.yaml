# Base: PP2/DP4 GBS64 config (the 399 TFLOPs champion)
# Enc TP4/DP16, LLM TP8/PP2/DP4+SP
# 50% vision: 8 images * 512 seq = 4096 tokens
experiment:
  name: 3b70b_push2_baseline
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 48
    hidden_size: 2304
    num_attention_heads: 32
    seq_length: 512
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 4
    dp: 16
  llm:
    tp: 8
    dp: 4
    pp: 2

data:
  micro_batch_size: 1
  num_microbatches: 16
  num_images_per_sample: 8

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48

sequence_parallel: true
pp_mode: colocated
encoder_param_offload: false
