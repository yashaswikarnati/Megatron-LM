# Homo PP4 uneven: 2 LLM layers on stage 0 (with encoder), 26 on each other stage
# (80 - 2) / 3 = 26 ✓
# TP8/PP4/DP2+SP, GBS128
experiment:
  name: 3b70b_homo_pp4_uneven2

parallelism:
  encoder:
    tp: 8
    dp: 2
  llm:
    tp: 8
    dp: 2
    pp: 4

data:
  num_microbatches: 64

pp_mode: homo
first_pipeline_num_layers: 2
