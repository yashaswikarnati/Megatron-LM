# 1B+32B Hetero enc TP2/DP32, 75% vision
# 6 images × 1024 seq = 6144 tokens
experiment:
  name: 1b32b_hetero_tp2_75pct
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 40
    hidden_size: 1408
    num_attention_heads: 16
    seq_length: 1024
  llm:
    num_layers: 64
    hidden_size: 6144
    num_attention_heads: 48
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 2
    dp: 32
  llm:
    tp: 4
    dp: 16
    pp: 1

data:
  micro_batch_size: 1
  num_microbatches: 8
  num_images_per_sample: 6

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 40

sequence_parallel: true
pp_mode: colocated
encoder_param_offload: false
