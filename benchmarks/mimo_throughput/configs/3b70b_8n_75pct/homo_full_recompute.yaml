# Homo PP8 uneven (3+11x7) + full uniform LLM recompute, 75% vision
# Same as homo_best but with uniform recompute on all 11 LLM layers per rank
# instead of block recompute 3. Goal: squeeze through where block3 OOM'd by ~0.5 GB.
experiment:
  name: 3b70b_75pct_homo_full_recompute
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 48
    hidden_size: 2304
    num_attention_heads: 32
    seq_length: 512
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 8
    dp: 1
  llm:
    tp: 8
    dp: 1
    pp: 8

data:
  micro_batch_size: 1
  num_microbatches: 128
  num_images_per_sample: 12

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48
  llm:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 11

sequence_parallel: true
pp_mode: homo
first_pipeline_num_layers: 3
encoder_param_offload: false
