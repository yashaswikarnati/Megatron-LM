# Hetero enc TP4/DP16, 75% vision + encoder dist opt instances=4
experiment:
  name: 3b70b_hetero_enc_tp4_distopt4_75pct
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 48
    hidden_size: 2304
    num_attention_heads: 32
    seq_length: 512
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 4
    dp: 16
  llm:
    tp: 8
    dp: 4
    pp: 2

data:
  micro_batch_size: 1
  num_microbatches: 32
  num_images_per_sample: 12

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48

sequence_parallel: true
pp_mode: colocated
encoder_param_offload: false
encoder_num_dist_opt_instances: 4
