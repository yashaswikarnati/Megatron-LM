# Config 2: Homo TP8/PP4/DP2+SP, 50% vision
# More PP, less DP — should fit easily but lower throughput
experiment:
  name: 3b70b_homo_fixed_pp4_dp2_50pct

parallelism:
  encoder:
    tp: 8
    dp: 2
  llm:
    tp: 8
    dp: 2
    pp: 4

data:
  micro_batch_size: 1
  num_microbatches: 64
  num_images_per_sample: 8
