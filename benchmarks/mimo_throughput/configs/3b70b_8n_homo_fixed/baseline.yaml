# Homo PP2/DP4 base config for 3B+70B on 8 nodes (64 GPUs)
# TP8/PP2/DP4+SP, GBS128, 50% vision (8 images x 512 seq)
#
# "Fixed" = all 5 bugs corrected: SP, encoder recompute, scatter_embedding,
# overlap_param_gather, timers. All previous homo 70B results are invalid.
experiment:
  name: 3b70b_homo_fixed_pp2_dp4_50pct
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 48
    hidden_size: 2304
    num_attention_heads: 32
    seq_length: 512
  llm:
    num_layers: 80
    hidden_size: 8192
    num_attention_heads: 64
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 8
    dp: 4
  llm:
    tp: 8
    dp: 4
    pp: 2

data:
  micro_batch_size: 1
  num_microbatches: 32
  num_images_per_sample: 8

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48

sequence_parallel: true
pp_mode: homo
encoder_param_offload: false
