# Config 4: Homo TP8/PP8/DP1+SP, 50% vision
# The old best config, now with proper SP. LLM block recompute 3 still
# needed for PP8 warmup activation stacking.
experiment:
  name: 3b70b_homo_fixed_pp8_dp1_50pct

parallelism:
  encoder:
    tp: 8
    dp: 1
  llm:
    tp: 8
    dp: 1
    pp: 8

data:
  micro_batch_size: 1
  num_microbatches: 128
  num_images_per_sample: 8

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48
  llm:
    recompute_granularity: full
    recompute_method: block
    recompute_num_layers: 3

first_pipeline_num_layers: 3
