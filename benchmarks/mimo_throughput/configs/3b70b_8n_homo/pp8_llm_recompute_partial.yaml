# PP8 even + partial LLM recompute (5 of 10 layers)
# Trade-off: less recompute overhead but more activation memory
experiment:
  name: 3b70b_homo_pp8_llm_recompute_partial

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48
  llm:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 5
