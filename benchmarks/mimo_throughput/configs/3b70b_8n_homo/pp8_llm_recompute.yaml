# PP8 even + full LLM recompute (all 10 layers per stage)
# This is the key fix: recompute kills the 7-warmup activation stacking
experiment:
  name: 3b70b_homo_pp8_llm_recompute

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48
  llm:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 10
