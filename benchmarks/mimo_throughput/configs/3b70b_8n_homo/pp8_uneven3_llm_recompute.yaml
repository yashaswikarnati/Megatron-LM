# PP8 uneven (3+11*7) + full LLM recompute
# Stage 0: 3 LLM layers + encoder, stages 1-7: 11 LLM layers each
experiment:
  name: 3b70b_homo_pp8_uneven3_recompute

memory:
  encoder:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 48
  llm:
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 11

first_pipeline_num_layers: 3
