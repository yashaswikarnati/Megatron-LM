# 3B ViT + 32B LLM, 8 nodes (64 GPUs), colocated hetero, PP4
# Encoder: TP4/DP16, LLM: TP4/DP4/PP4
experiment:
  name: offload_3b32b_baseline
  num_iterations: 10
  warmup_iterations: 3
  log_interval: 1

model:
  encoder:
    num_layers: 48
    hidden_size: 2304
    num_attention_heads: 32
    seq_length: 1024
  llm:
    num_layers: 64
    hidden_size: 6144
    num_attention_heads: 48
    vocab_size: 128000
    seq_length: 8192

parallelism:
  encoder:
    tp: 4
    dp: 16
  llm:
    tp: 4
    dp: 4
    pp: 4

data:
  micro_batch_size: 1
  num_microbatches: 4
  num_images_per_sample: 4

encoder_param_offload: false
